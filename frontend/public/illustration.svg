  <g transform="translate(70 92) rotate(-5 190 230)" filter="url(#bigShadow)">
    <rect width="380" height="460" rx="26" fill="url(#card)" stroke="#fbbf24" stroke-width="4"/>
    <rect x="24" y="24" width="176" height="38" rx="19" fill="#fbbf24"/>
    <text x="112" y="50" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">I am a place</text>
